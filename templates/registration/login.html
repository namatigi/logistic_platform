{% extends 'base.html' %}
{% block title %}Sign In &middot; HYPAX{% endblock %}
{% block content %}
<div class="auth-theme">
  <div class="auth-themed-bg" aria-hidden="true">
    <svg class="bg-truck bg-truck-1" viewBox="0 0 512 256" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 150h250v70H20z"/>
      <circle cx="90" cy="240" r="22"/><circle cx="205" cy="240" r="22"/>
      <path d="M270 150h120l60 55v15h-60"/>
      <path d="M390 168v30h45l-22-30h-23z"/>
      <circle cx="355" cy="240" r="22"/><circle cx="435" cy="240" r="22"/>
      <path d="M120 90h80l30 60H90z" fill="currentColor" fill-opacity="0.35"/>
    </svg>

    <svg class="bg-truck bg-truck-2" viewBox="0 0 512 256" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 158h180v62H20z"/>
      <circle cx="85" cy="235" r="20"/>
      <path d="M200 158h70l40 36v24h-45"/>
      <path d="M270 176v24h30l-12-24h-18z"/>
      <circle cx="300" cy="235" r="20"/>
      <path d="M70 130l40-48 30 20 30-34 35 62" fill="currentColor" fill-opacity="0.3"/>
    </svg>

    <svg class="bg-truck bg-truck-3" viewBox="0 0 512 256" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 160h200v56H20z"/>
      <circle cx="95" cy="232" r="20"/>
      <path d="M220 160h80l45 40v16h-50"/>
      <circle cx="325" cy="232" r="20"/>
      <path d="M140 100h60l25 44H115z" fill="currentColor" fill-opacity="0.32"/>
      <path d="M60 128l40-40 22 18 26-30 30 52" fill="currentColor" fill-opacity="0.32"/>
    </svg>

    <div class="bg-container bg-container-1"><svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="6"><rect x="30" y="50" width="140" height="120" rx="4"/><path d="M30 100h140"/><path d="M90 50v120"/><rect x="52" y="68" width="20" height="20" rx="2"/></svg></div>
    <div class="bg-container bg-container-2"><svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="6"><rect x="30" y="50" width="140" height="120" rx="4"/><path d="M30 100h140"/><path d="M90 50v120"/><rect x="52" y="68" width="20" height="20" rx="2"/></svg></div>
    <div class="bg-container bg-container-3"><svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="6"><rect x="30" y="50" width="140" height="120" rx="4"/><path d="M30 100h140"/><path d="M90 50v120"/><rect x="52" y="68" width="20" height="20" rx="2"/></svg></div>

    <div class="bg-depot-label">Inland Container Depot</div>
  </div>

  <div class="auth-card">
    <a href="{% url 'users:login' %}" class="auth-brand" style="text-decoration:none; color:inherit;">
      <span class="brand-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"/>
          <path d="M14 9h4l3 3v5c0 .6-.4 1-1 1h-1"/>
          <circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>
        </svg>
      </span>
      <span>HYPAX<small>Cargo Logistic &amp; Transportation</small></span>
    </a>
    <h1 class="auth-heading">Welcome back</h1>
    <p class="auth-sub">Sign in with your email address</p>

    <div id="auth-app" data-url="{% url 'users:api_login' %}">
      {% verbatim %}
      <div v-cloak>
        <div class="alert alert-error" v-if="error">{{ error }}</div>

        <form novalidate @submit.prevent="submit">
          <div class="form-row">
            <label for="login-email">Email address</label>
            <input id="login-email" type="email" v-model.trim="email" autocomplete="email" required>
          </div>
          <div class="form-row">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" v-model="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block" :disabled="loading">
            <span v-if="loading">Signing in...</span>
            <span v-else>Sign in</span>
          </button>
        </form>
      </div>
      {% endverbatim %}
    </div>

    <p class="auth-footer">
      Don't have an account? <a href="{% url 'users:signup' %}">Sign up</a>
    </p>
  </div>
</div>
<script>
  (function () {
    var root = document.getElementById('auth-app');
    var api = window.HYPAX.api;
    Vue.createApp({
      data: function () {
        return { email: '', password: '', error: '', loading: false };
      },
      methods: {
        submit: async function () {
          var self = this;
          self.error = '';
          self.loading = true;
          try {
            var res = await api.post(root.dataset.url, { email: self.email, password: self.password });
            if (res && res.ok === false) {
              self.error = res.error || 'Login failed.';
              return;
            }
            window.location.href = (res && res.redirect) || '/tenders/';
          } catch (e) {
            self.error = e.message || 'Login failed.';
          } finally {
            self.loading = false;
          }
        }
      }
    }).mount('#auth-app');
  })();
</script>
{% endblock %}
