{% extends 'base.html' %}
{% block title %}Sign In &middot; HYPAX{% endblock %}
{% block content %}
<div class="auth-theme theme-midnight" id="auth-theme">
  <div class="auth-themed-bg" aria-hidden="true">
    <div class="bg-depot-label">Inland Container Depot</div>
  </div>

  <div class="auth-card">
    <a href="{% url 'users:login' %}" class="auth-brand" style="text-decoration:none; color:inherit;">
      <span class="brand-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"/>
          <path d="M14 9h4l3 3v5c0 .6-.4 1-1 1h-1"/>
          <circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>
        </svg>
      </span>
      <span>HYPAX<small>Cargo Logistic &amp; Transportation</small></span>
    </a>
    <h1 class="auth-heading">Welcome back</h1>
    <p class="auth-sub">Sign in with your email address</p>

    <div id="auth-app" data-url="{% url 'users:api_login' %}">
      {% verbatim %}
      <div v-cloak>
        <div class="alert alert-error" v-if="error">{{ error }}</div>

        <form novalidate @submit.prevent="submit">
          <div class="form-row">
            <label for="login-email">Email address</label>
            <input id="login-email" type="email" v-model.trim="email" autocomplete="email" required>
          </div>
          <div class="form-row">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" v-model="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block" :disabled="loading">
            <span v-if="loading">Signing in...</span>
            <span v-else>Sign in</span>
          </button>
        </form>
      </div>
      {% endverbatim %}
    </div>

    <p class="auth-footer">
      Don't have an account? <a href="{% url 'users:signup' %}">Sign up</a>
    </p>
  </div>
</div>
<script>
  (function () {
    var root = document.getElementById('auth-app');
    var api = window.HYPAX.api;
    Vue.createApp({
      data: function () {
        return { email: '', password: '', error: '', loading: false };
      },
      methods: {
        submit: async function () {
          var self = this;
          self.error = '';
          self.loading = true;
          try {
            var res = await api.post(root.dataset.url, { email: self.email, password: self.password });
            if (res && res.ok === false) {
              self.error = res.error || 'Login failed.';
              return;
            }
            window.location.href = (res && res.redirect) || '/tenders/';
          } catch (e) {
            self.error = e.message || 'Login failed.';
          } finally {
            self.loading = false;
          }
        }
      }
    }).mount('#auth-app');
  })();
</script>
{% endblock %}
